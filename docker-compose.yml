version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  vllm:
    image: ghcr.io/huggingface/text-generation-inference:2.3.1
    volumes:
      - ./models:/models
    ports:
      - "8000:80"
    command: >
      --model-id /models/Qwen2.5-3B-QASPER-AWQ-4bit
      --quantize awq
      --max-input-tokens 4096
      --max-total-tokens 5120
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    # vLLM requires a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - VLLM_URL=http://vllm:80/v1
    depends_on:
      - qdrant
    volumes:
      - ./datasets:/app/datasets # For uploading papers
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
